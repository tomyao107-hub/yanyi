[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-translation-workbench"
version = "0.1.0"
description = "Local EPUB and Markdown AI translation workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=25.1,<26",
  "beautifulsoup4>=4.12,<5",
  "cryptography>=46,<50",
  "ebooklib>=0.18,<1",
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "litellm>=1.40,<2",
  "lxml>=5,<7",
  "markdown-it-py>=3,<5",
  "mdit-py-plugins>=0.4,<1",
  "pydantic-settings>=2.2,<3",
  "python-multipart>=0.0.9,<1",
  "sqlmodel>=0.0.16,<1",
  "tenacity>=8.2,<10",
  "tiktoken>=0.7,<1",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[project.scripts]
trans = "backend.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
  "ASYNC109", # timeout is a valid API parameter name
  "ASYNC240", # small local Path operations are intentional in request handlers
  "B008",
]
